# Runs jobwatch on a schedule so no computer of yours needs to stay on.
#
# State (which jobs were already seen/emailed) lives on a dedicated `state`
# branch as normal linear history — runners are wiped between runs, a branch
# is not. Missing state is bootstrapped only by an explicit manual run; a
# failed restore stops the run instead of risking replacement state. Later
# catalog additions are seeded per source by -seed-new-sources.
#
# Required repository secrets (Settings → Secrets → Actions):
#   JOBWATCH_SMTP_USERNAME  e.g. your Gmail address (also used as From)
#   JOBWATCH_SMTP_PASSWORD  e.g. a Gmail app password
#   JOBWATCH_EMAIL_TO       where the alerts go
#   JOBWATCH_LLM_API_KEY     Google AI Studio key for the configured matcher

name: jobwatch

on:
  schedule:
    - cron: "13,43 * * * *" # every 30 minutes (UTC); odd minutes avoid the on-the-hour rush
  workflow_dispatch:
    inputs:
      initialize_state:
        description: "Initialize a missing state branch by seeding all current jobs"
        required: false
        default: false
        type: boolean

permissions:
  contents: write # to push the state branch

concurrency:
  group: jobwatch-state # never let two runs race on the state branch
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    # Hosted runners hard-kill jobs at 360 minutes. The poll step has its own
    # shorter timeout so summary/publication can run after an ordinary poll
    # failure; cancellation or the job hard limit cannot guarantee that.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Restore state from the state branch
        id: restore
        run: |
          go run ./cmd/statebranch restore \
            --remote origin \
            --branch state \
            --state state.json \
            --allow-bootstrap="${{ github.event_name == 'workflow_dispatch' && inputs.initialize_state }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Build
        id: build
        run: |
          go test ./...
          go vet ./...
          go build -o jobwatch ./cmd/jobwatch

      - name: Poll job boards
        id: poll
        # A backlog sweep (LLM-matching hundreds of new postings) can run for
        # hours. jobwatch checkpoints state to disk every minute and after
        # every board, bounding lost work when this step fails and the later
        # publication step is still allowed to run. The 10-minute gap to the
        # job timeout leaves room for that publication; explicit cancellation
        # and a job-level hard timeout intentionally publish nothing.
        timeout-minutes: 345
        env:
          JOBWATCH_SMTP_USERNAME: ${{ secrets.JOBWATCH_SMTP_USERNAME }}
          JOBWATCH_SMTP_PASSWORD: ${{ secrets.JOBWATCH_SMTP_PASSWORD }}
          JOBWATCH_EMAIL_TO: ${{ secrets.JOBWATCH_EMAIL_TO }}
          JOBWATCH_LLM_API_KEY: ${{ secrets.JOBWATCH_LLM_API_KEY }}
          # Extra channels: add the secret, then mirror it here and enable
          # the matching notifier in config.example.yaml.
          # JOBWATCH_SLACK_WEBHOOK: ${{ secrets.JOBWATCH_SLACK_WEBHOOK }}
          # JOBWATCH_TELEGRAM_TOKEN: ${{ secrets.JOBWATCH_TELEGRAM_TOKEN }}
        run: |
          set -o pipefail
          case "${{ steps.restore.outputs.mode }}" in
            restored)
              ./jobwatch -config config.example.yaml -state state.json -seed-new-sources 2>&1 | tee run.log
              ;;
            bootstrap)
              ./jobwatch -config config.example.yaml -state state.json -seed 2>&1 | tee run.log
              ;;
            *)
              echo "invalid state restore mode: ${{ steps.restore.outputs.mode }}" >&2
              exit 1
              ;;
          esac

      - name: Publish run summary
        if: always()
        run: |
          [ -f run.log ] || exit 0
          {
            echo "### jobwatch run"
            echo '```'
            grep -E "^jobwatch .*(starting|run complete|seeded|state saved|notify )" run.log | sed 's/^jobwatch //' | tail -8
            echo '```'
            if grep -q "MATCH " run.log; then
              echo "### Matches"
              grep "MATCH " run.log | sed -E 's/^jobwatch [0-9\/]+ [0-9:]+ MATCH +/- /' | head -40
            else
              echo "_No new matches this run._"
            fi
            if grep -qE "fetch .+\([1-9][0-9]* new" run.log; then
              echo "### Boards with new postings"
              echo '```'
              grep -E "fetch .+\([1-9][0-9]* new" run.log | sed -E 's/^jobwatch [0-9\/]+ [0-9:]+ //' | head -30
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish state
        id: publish
        # A restored run may have valid checkpoints even when polling fails.
        # A bootstrap is publishable only after the complete seed succeeds.
        if: >-
          ${{
            !cancelled() &&
            steps.restore.outcome == 'success' &&
            steps.build.outcome == 'success' &&
            (steps.poll.outcome == 'success' || steps.poll.outcome == 'failure') &&
            (steps.restore.outputs.mode == 'restored' || steps.poll.outcome == 'success')
          }}
        run: |
          go run ./cmd/statebranch publish \
            --remote origin \
            --branch state \
            --state state.json \
            --mode "${{ steps.restore.outputs.mode }}" \
            --base-sha "${{ steps.restore.outputs.base_sha }}" \
            --source-sha "$GITHUB_SHA" \
            --github-output "$GITHUB_OUTPUT"
